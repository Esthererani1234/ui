<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gold On The Spot | Pickup trial</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4f0;color:#102c40;font:16px/1.5 system-ui}header{background:#0b2334;color:#fff;padding:18px max(calc((100vw - 640px)/2),18px);font-weight:700}main{max-width:640px;margin:22px auto;padding:0 16px}article{background:white;border:1px solid #d6d8d7;padding:clamp(18px,4vw,32px)}h1{font:34px/1.12 Georgia;margin:8px 0 18px}h2{font-size:18px}button,select,input{font:inherit;padding:10px;max-width:100%}button{cursor:pointer;background:#10364e;color:white;border:1px solid #10364e;border-radius:4px;margin:4px 2px}button:disabled{opacity:.48;cursor:default}button[aria-pressed=false]{background:white;color:#10364e}button:focus-visible,input:focus-visible{outline:3px solid #be942e}small{color:#526571}aside{padding:12px;background:#f5f2e9;margin:14px 0}canvas{width:100%;height:110px;touch-action:none;border:1px solid #8898a0;background:white}label{display:block;margin:12px 0}address{font-style:normal}footer{margin:16px 0;font-size:13px}p{margin:10px 0}
</style><header>Gold On The Spot</header><main><small>INTERACTIVE TRIAL · SAMPLE DATA ONLY</small><article id="screen" aria-live="polite"></article><footer>No real order, payment, signature record, or email is created. Refresh to start over.</footer></main>
<script>
const addr='149 Madison Avenue, Floor 6, Room 614, New York, NY 10016',screen=document.querySelector('#screen');
let method='pickup',stage='cart',paid=false,slots=[],chosen=null,signed=false;const deadline=Date.now()+600000;
function btn(label,id,extra=''){return '<button type="button" id="'+id+'" '+extra+'>'+label+'</button>'}
function on(id,fn){const e=document.getElementById(id);if(e)e.onclick=fn}
const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function displaySlot(s){return new Intl.DateTimeFormat('en-US',{timeZone:'UTC',dateStyle:'full',timeStyle:'short'}).format(new Date(s+'Z'))+' (New York time)'}
function draw(){let h='';if(stage==='cart'){
 h='<h1>Checkout</h1><h2>How would you like your order?</h2>'+btn('Delivery','delivery','aria-pressed="'+(method==='delivery')+'"')+btn('Free office pickup','pickup','aria-pressed="'+(method==='pickup')+'"')+(method==='pickup'?'<aside><b>Manhattan office</b><address>'+addr+'</address>By appointment. We’ll email pickup times once your payment clears and your items are ready.</aside>':'<aside>Delivery to your shipping address. This trial focuses on office pickup.</aside>')+'<p>1 × American Gold Buffalo · 1 troy oz</p><p>Price lock: <span id="clock"></span></p>'+(method==='pickup'?btn('Place sample wire order','place'):'');
 }else{h='<small>ORDER DEMO-614 · OFFICE PICKUP</small><p>1 × American Gold Buffalo · 1 troy oz</p>';
 if(stage==='wire')h+='<h1>Awaiting wire payment</h1><p>Your order has been received. Your appointment is not scheduled.</p><aside>Live orders would show private wire instructions here.</aside>'+btn('Simulate verified payment','paid');
 if(stage==='preparing')h+='<h1>Preparing for pickup</h1><p>Payment received. We’ll email you when your items are ready.</p>'+btn('Try admin: offer pickup times','admin');
 if(stage==='offer')h+='<h1>Offer pickup times</h1><p>Admin view · Enter two or three different future times in New York.</p>'+[1,2,3].map(i=>'<label>Time '+i+(i===3?' (optional)':'')+' <input type="datetime-local" id="t'+i+'"></label>').join('')+btn('Offer these times','offer')+'<p role="alert" id="err"></p>';
 if(stage==='choose')h+='<h1>Choose your pickup time</h1><address>'+addr+'</address>'+slots.map((s,i)=>btn(escapeText(displaySlot(s)),'s'+i)).join('');
 if(stage==='booked')h+='<h1>Pickup confirmed</h1><p><b>'+escapeText(displaySlot(chosen))+'</b></p><address>'+addr+'</address>'+btn('Try admin: record handoff','handoff');
 if(stage==='handoff')h+='<h1>Confirm handoff</h1><label><input type="checkbox" id="idok"> I verified the recipient and handed over the listed item.</label><label>Sample signature (draw a mark)<canvas id="pad" width="500" height="110"></canvas></label>'+btn('Clear','clear')+btn('Mark picked up','done','disabled');
 if(stage==='done')h+='<h1>Picked up</h1><p>Receipt for DEMO-614. Your sample handoff is complete.</p><address>'+addr+'</address>';
 }screen.innerHTML=h;on('pickup',()=>{method='pickup';draw()});on('delivery',()=>{method='delivery';draw()});on('place',()=>{if(Date.now()>=deadline)return;stage='wire';draw()});on('paid',()=>{paid=true;stage='preparing';draw()});on('admin',()=>{if(paid){stage='offer';draw()}});on('offer',()=>{let a=[1,2,3].map(i=>document.getElementById('t'+i).value).filter(Boolean);const now=new Date();const fmt=new Intl.DateTimeFormat('sv-SE',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});if(a.length<2||new Set(a).size!==a.length||a.some(s=>s<=fmt.format(now).replace(' ','T'))){document.querySelector('#err').textContent='Enter at least two different future times.';return}slots=a.sort();stage='choose';draw()});slots.forEach((s,i)=>on('s'+i,()=>{chosen=s;stage='booked';draw()}));on('handoff',()=>{stage='handoff';signed=false;draw()});if(stage==='handoff'){let pad=document.querySelector('#pad'),ctx=pad.getContext('2d'),down=false;const pos=e=>{let r=pad.getBoundingClientRect();return [(e.clientX-r.left)*pad.width/r.width,(e.clientY-r.top)*pad.height/r.height]};function check(){document.querySelector('#done').disabled=!(signed&&document.querySelector('#idok').checked)}pad.onpointerdown=e=>{down=true;pad.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e))};pad.onpointermove=e=>{if(down){ctx.lineTo(...pos(e));ctx.stroke();signed=true;check()}};pad.onpointerup=pad.onpointercancel=()=>down=false;document.querySelector('#idok').onchange=check;on('clear',()=>{ctx.clearRect(0,0,pad.width,pad.height);signed=false;check()});on('done',()=>{if(signed&&document.querySelector('#idok').checked){stage='done';draw()}})}tick()}
function tick(){let c=document.querySelector('#clock');if(c){let t=Math.max(0,Math.ceil((deadline-Date.now())/1000));c.textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');if(!t&&document.querySelector('#place'))document.querySelector('#place').disabled=true}}
draw();setInterval(tick,1000)
</script></html>
